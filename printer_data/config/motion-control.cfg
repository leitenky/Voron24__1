####################################################################################
#  [X/Y Stepper Settings]
####################################################################################

#   B ------------ A
#   |              |
#   |------E-------|  
#   |              |
#   |              |
#   |              |
# stealthchop_threshold:
# 0 → SpreadCycle only (performance, torque) - X/Y/E
# 999999 → StealthChop only (silence, smoothness) - Z

[stepper_x]                        ## Connect to X motor (B motor) Connected to X-MOT (B Motor)
step_pin: PE11                      # X-axis motor pulse pin setting
dir_pin: !PE10                      # X-axis motor direction pin setting
enable_pin: !PE9                    # X-axis motor enable pin setting
rotation_distance: 40               # Driving pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
microsteps: 32                      # Motor Segmentation Setting
full_steps_per_rotation:200         # The number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc2209_stepper_x:virtual_endstop # Sensorless Homing
position_min: 0                     # X-axis minimum stroke--software limit
position_endstop: 350               # The mechanical reset point coordinates of the X-axis (if it is a 300 model, it needs to be changed to 300)
position_max: 350                   # X-axis maximum stroke--software limit (if it is a 300 model, it needs to be changed to 300)
homing_speed: 80                    # Reset speed max 100 - Sensorless Homing
homing_retract_dist: 0              # Sensorless homing
homing_positive_dir: true           # Reset direction (generally no need to change)

[tmc2209 stepper_x]                 # stepper motor-x tmc2209 driver
uart_pin: PE7                       # Communication port pin definition
diag_pin: ^PB14                     # Sensorless Homing - Set to MCU pin connected to TMC DIAG pin		   
interpolate: true                   # Whether to enable 256 microstep interpolation ## Was True
run_current: 0.95                   # Motor running current value
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 200          # Mute Threshold
driver_SGTHRS: 120                  # Sensorless Homing - 255 is most sensitive value, 0 is least sensitive
# Min + (Max - Min) = 80 + (150 - 80) = 115


[stepper_y]                        ## Connect to Y motor (A motor) Connected to X-MOT (B Motor)
step_pin: PD8                       # Y-axis motor pulse pin
dir_pin: !PB12                      # orientation setting
enable_pin: !PD9                    # enable pin
rotation_distance: 40               # Drive wheel circumference mm (2GT-20T is 40mm, 16T is 32mm)
microsteps: 32                      # Segmentation
full_steps_per_rotation:200         # Number of pulses per revolution - set to 400 for 0.9 degree steps
endstop_pin: tmc2209_stepper_y:virtual_endstop # Sensorless Homing
position_min: 0                     # Soft limit minimum stroke
position_endstop: 350               # The mechanical reset point coordinates of the y-axis (if it is a 300 model, it needs to be changed to 300)
position_max: 385                   # The maximum stroke of the y-axis--software limit (if it is a 300 model, it needs to be changed to 300)
homing_speed: 80                    # Sensorless Homing 
homing_retract_dist: 0              # Sensorless homing
homing_positive_dir: true           # Reset direction (generally no need to change)

[tmc2209 stepper_y]                 # Stepper motor-y tmc2209 driver
uart_pin: PE15                      # Driver communication port
diag_pin: ^PB13                     # Sensorless Homing - Set to MCU pin connected to TMC DIAG pin			   
interpolate: true                   # Microstep Interpolation 256  ## Was True
run_current: 0.95                   # Running current mA
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 200          # Mute Threshold
driver_SGTHRS: 120                  # Sensorless Homing - 255 is most sensitive value, 0 is least sensitive
# Min + (Max - Min) = 80 + (150 - 80) = 115


####################################################################################
#  Z Stepper Settings
####################################################################################

#   z1 ---back --- z2
#   |              |
#   |              |
#   |              |
#   |              |
#   z0 ---Front--- z3


[stepper_z]                        ## Z stepper motor - front left in M3 Z-MOT Position
step_pin: PD14                      # Z motor pulse pin
dir_pin: !PD13                      # orientation setting
enable_pin: !PD15                   # enable pin
rotation_distance: 40               # Drive wheel circumference mm (2GT-20T is 40mm, 16T is 32mm)
gear_ratio: 80:16                   # Reduction ratio
microsteps: 32                      # Segmentation
# endstop_pin: ^PA0                   # In Z- Position - replaced for Eddy
endstop_pin: probe:z_virtual_endstop
##  position_endstop is the distance from the Z limit pin trigger point relative to the printing surface (Z0)
##  Positive value = end point above platform, negative value = end point below platform
##	Increasing the value of position_endstop will bring the nozzle closer to the bed
##  After running Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the end of the CFG configuration
#position_endstop: 1.950            # Modify according to actual
position_max: 340                   # Z axis maximum printing height
position_min: -10                   # Soft limit minimum stroke
homing_speed: 20                    # Reset Speed ​​- Max 20
second_homing_speed: 3              # Secondary reset speed - 10 max
homing_retract_dist: 3              # retreat distance

[tmc2209 stepper_z]                 # Stepper motor - z tmc2209 driver
uart_pin: PD10                      # Driver communication port
uart_address: 0
interpolate: true                  # Microstep Interpolation 256
run_current: 0.8                    # Running current mA
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 999999       # Mute Threshold


[stepper_z1]                       ## Z1 stepper motor - Rear left in M5 E1-MOT Position
step_pin: PE6                       # Z1 motor pulse pin
dir_pin: PC13                       # orientation setting
enable_pin: !PE5                    # enable pin
rotation_distance: 40               # Drive wheel circumference mm (2GT-20T is 40mm, 16T is 32mm)
gear_ratio: 80:16                   # Reduction ratio
microsteps: 32                      # Segmentation

[tmc2209 stepper_z1]                # Stepper motor - z1 tmc2209 driver
uart_pin: PC14                      # Driver communication port
interpolate: true                   # Microstep Interpolation 256
run_current: 0.8                    # Running current mA
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 999999       # Mute Threshold


[stepper_z2]                       ## Z2 stepper motor - Rear right in M6 E2-MOT Position
step_pin: PE2                       # Z2 motor pulse pin
dir_pin: !PE4                       # orientation setting
enable_pin: !PE3                    # enable pin
rotation_distance: 40               # Drive wheel circumference mm (2GT-20T is 40mm, 16T is 32mm)
gear_ratio: 80:16                   # Reduction ratio
microsteps: 32                      # Segmentation

[tmc2209 stepper_z2]                # Stepper motor - z2 tmc2209 driver
uart_pin: PC15                      # Driver communication port
interpolate: true                  # Microstep Interpolation 256
run_current: 0.8                    # Running current mA
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 999999       # Mute Threshold


[stepper_z3]                       ## Z3 stepper motor - front right in M7 E3-MOT Position
step_pin: PD12                      # Z3 motor pulse pin
dir_pin: PC4                        # orientation setting
enable_pin: !PE8                    # enable pin
rotation_distance: 40               # Drive wheel circumference mm (2GT-20T is 40mm, 16T is 32mm)
gear_ratio: 80:16                   # Reduction ratio
microsteps: 32                      # Segmentation

[tmc2209 stepper_z3]                # Stepper motor - z3 tmc2209 driver
uart_pin: PA15                      # Driver communication port
interpolate: true                   # Microstep Interpolation 256
run_current: 0.8                    # Running current mA
sense_resistor: 0.110               # Do not change the drive sampling resistor
stealthchop_threshold: 999999       # Mute Threshold
