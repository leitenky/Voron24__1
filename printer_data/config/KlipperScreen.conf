########################################
# Override the default preheats
########################################

[preheat ABS]
extruder: 250
heater_bed: 110
# # Use the name
chamber: 35
# # or the full name
# heater_generic chamber: 60
# # or for example apply the same temp to devices of the same type
# temperature_fan: 40
# heater_generic: 60
# # optional GCode to run when the option is selected
gcode: M117 Preheating for ABS

[preheat PETG]
extruder: 245
heater_bed: 80
# # Use the name
chamber: 25
# # or the full name
# heater_generic chamber: 60
# # or for example apply the same temp to devices of the same type
# temperature_fan: 40
# heater_generic: 60
# # optional GCode to run when the option is selected
gcode: M117 Preheating for PETG

[preheat PLA]
extruder: 210
heater_bed: 70
# # Use the name
chamber: 20
# # or the full name
# heater_generic chamber: 60
# # or for example apply the same temp to devices of the same type
# temperature_fan: 40
# heater_generic: 60
# # optional GCode to run when the option is selected
gcode: M117 Preheating for PLA

[preheat PLA+]
extruder: 220
heater_bed: 70
# # Use the name
chamber: 20
# # or the full name
# heater_generic chamber: 60
# # or for example apply the same temp to devices of the same type
# temperature_fan: 40
# heater_generic: 60
# # optional GCode to run when the option is selected
gcode: M117 Preheating for PLA+

[preheat TPU]
extruder: 230
heater_bed: 70
# # Use the name
chamber: 20
# # or the full name
# heater_generic chamber: 60
# # or for example apply the same temp to devices of the same type
# temperature_fan: 40
# heater_generic: 60
# # optional GCode to run when the option is selected
gcode: M117 Preheating for TPU


