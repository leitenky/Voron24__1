####################################################################################
#   Bed Heater
####################################################################################

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
control: watermark
max_power: 0.9                # Hot bed power - Kyle - was 0.6
min_temp: 0                   # Minimum temperature (note: the measured temperature exceeding the set value will trigger an emergency stop)
max_temp: 130                 # Maximum temperature (Note: Measuring temperature exceeding the set value will trigger an emergency stop)


[verify_heater heater_bed]
max_error: 120                # Allow up to 2 min total deviation before error
check_gain_time: 30           # Check temperature every 30 seconds
heating_gain: 2               # Expect at least 4°C increase every 30s
hysteresis: 6                 # Allow ±6°C tolerance to avoid false shutdowns

