[controller_fan drivers_fan]
pin: PE5
max_power: 1
shutdown_speed: 0
stepper: stepper_x, stepper_y
fan_speed: 0.7
idle_timeout: 10

[temperature_fan raspberry_pi]
pin: PA8
target_temp: 50
max_power: 1
off_below: 0.31
sensor_type: temperature_host
min_temp: 0
max_temp: 100
control = watermark
min_speed: 0
max_speed: 1
shutdown_speed: 0


####################################################################################
#   Pi and MCU temperature monitoring
####################################################################################

[temperature_sensor MCU_CPU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 85

[temperature_sensor Pi_CPU]
sensor_type: temperature_host
sensor_path:/sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 85

[temperature_sensor SB2040_CPU]
sensor_type: temperature_mcu
sensor_mcu: SB2040-PRO
min_temp: 0
max_temp: 85