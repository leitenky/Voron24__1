[fan_generic nevermore]
pin: PD12
max_power: 1
kick_start_time: 0
off_below: 0.30
shutdown_speed: 0


####################################################################################
#   Fan Control
####################################################################################

[heater_fan hotend_fan]            ## Hotend Fan - FAN1 Connector
pin: SB2040-PRO:FAN_HE              # SB2040-Pro Config
max_power: 1.0                      # Maximum speed
kick_start_time: 0.1                # Start time (do not move)
heater: extruder                    # Associated Equipment: Extruder
heater_temp: 50.0                   # How many degrees does the extruder reach to start the fan
fan_speed: 0.9                      # speed of the fan
shutdown_speed: 0
cycle_time: 0.010

[fan]                              ## Print Cooling Fan - FAN0 Connector
pin: SB2040-PRO:FAN_PC              # SB2040-Pro Config
cycle_time: 0.1                     # SB2040-Pro Config
max_power: 1.0                      # Maximum speed
kick_start_time: 0.25               # Start time (do not move)
off_below: 0.10                     # don't move

[multi_pin skirt_fan_pins]
pins: PD14,PD15

[controller_fan skirt_fan]            ## Controller fan -Kyle Voron 1
pin: multi_pin:skirt_fan_pins               # signal interface
kick_start_time: 0.2                        # Start time (do not move)
fan_speed: 0.7                              # limit to 80% - Does not work?
idle_timeout: 10                            # Idle Timeout
heater: heater_bed, extruder                # Associated equipment: heated bed, extruder
stepper: stepper_x, stepper_y, stepper_z    # Associated equipment: Steppers
#heater_temp: 35.0                          # What temperature does the hot bed reach to start the fan

