####################################################################################
#      Master ID Configuration
####################################################################################

[duplicate_pin_override]
pins: ADC_TEMPERATURE,temperature_mcu,PF5

[mcu]
#serial: /dev/ttyAMA0
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_36003A000A5053424E363420-if00
#restart_method: command
#baud: 250000
canbus_uuid: 3eaf2d8636b9

# Firmware Flashing:
# https://docs.vorondesign.com/build/software/spider_klipper.html
# Device ID: 0483:df11

# Firmware Update Process:
# 1. cd ~/klipper && rm -rf ~/klipper/.config && rm -rf ~/klipper/out && make menuconfig
# 2. In the menuconfig interface:  
# 	-Set the micro-controller architecture is set to STMicroelectronics STM32
# 	-Set the Processor model to STM32F446
# 	-set the Bootloader offset to 32KiB bootloader
# 	-Set the Clock Reference to 12 MHz crystal
# 	-Set the Communication interface to USB (on PA11/PA12)
#   -Press `Q`, then `Y` to save and exit. 
# 3. sudo service klipper stop
# 4. cd ~/klipper
# 5. make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32f446xx_2A0035001851303439363932-if00
# 6. sudo service klipper start

[printer]                           # Printer Settings
kinematics: corexy                  # Kinematic structure is divided into Cartesian and corexy, etc. Voron2.4 is corexy
max_velocity: 300                   # Maximum speed
max_z_velocity: 15                  # Z-axis maximum speed
max_z_accel: 300                    # Z axis maximum acceleration
square_corner_velocity: 5.0         # Square corner speed, a smaller one can effectively avoid the inertia caused by platform weight
max_accel: 5000                     # Maximum acceleration up to 4000


####################################################################################
#   Included Configs
####################################################################################

# [include eddy.cfg]                   # Z-offset function for eddy sensor
#[include eddy_setup.cfg]             # Eddy Setup/Calibration config
[include KAMP_Settings.cfg]          # Adaptive Mesh and Purge Config
[include K-ShakeTune/*.cfg]          # Klippain Shake & Tune
[include LED-control.cfg]            # Steathburner LED and Chamber LED
[include macros.cfg]                 # Macro Configs
[include moonraker_obico_macros.cfg] # Obico Settings
[include motion-control.cfg]         # Motors and extruder
[include thermal-control.cfg]        # Heaters and Fans
[include SB2040-Pro_v3.cfg]          # SB2040-Pro Alis File for Mellow Fly SB2040 v3
#[include mainsail.cfg]              # Mainsail CFG (not used, for reference only)


####################################################################################
#   Bed Mesh
####################################################################################

# [bed_mesh]                        # Klicky
# speed: 200                        # Calibration speed
# horizontal_move_z: 10             # Z axis lift
# mesh_min: 40, 40                  # Minimum calibration point coordinates x, y
# mesh_max: 310,310                 # Maximum calibration point coordinates x, y
# fade_start: 0.6                   # Start phasing out the adjusted Z height. Before starting the fade process, it's best to reduce a few layers
# fade_end: 10.0                    # This value can be adjusted according to how curved the printing surface is
# fade_target: 0                    # Can be considered as an additional z offset applied to the entire bed after the fade is complete
# probe_count: 5,5                  # Number of sampling points (5X5 is 25 points)
# algorithm: bicubic                # Algorithm model
# zero_reference_position: 175,175  # Calibration location (matches Auto Z Ref Location)

# [bed_mesh]                          # Eddy
# speed: 200                          # Calibration speed
# horizontal_move_z: 2                # Z axis lift
# mesh_min: 15, 22                    # Minimum calibration point coordinates x, y
# mesh_max: 310,310                   # Maximum calibration point coordinates x, y
# fade_start: 1.04                    # Start phasing out the adjusted Z height. Before starting the fade process, it's best to reduce a few layers
# fade_end: 10.0                      # This value can be adjusted according to how curved the printing surface is
# fade_target: 0                      # Can be considered as an additional z offset applied to the entire bed after the fade is complete
# probe_count: 20, 20                 # Number of sampling points (5X5 is 25 points)
# mesh_pps: 2, 3                      # Mesh Points Per Segment
# algorithm: bicubic                  # Algorithm model
# zero_reference_position: 175,175    # Calibration location (matches Auto Z Ref Location)

[bed_mesh]                         ## TAP
speed: 550
probe_count: 5
horizontal_move_z: 1
algorithm: bicubic
mesh_min: 25,25
mesh_max: 325,325
zero_reference_position: 175, 175
fade_start: 0.6
fade_end: 10.0


####################################################################################
