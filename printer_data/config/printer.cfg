####################################################################################
#   Gantry Leveling
####################################################################################

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 200                    # leveling speed
horizontal_move_z: 15          # Z axis starting height
retries: 10                   # Number of out-of-tolerance retries
retry_tolerance: 0.01         # Sampling Tolerance
max_adjust: 10                # Leveling maximum adjustment stroke


