#### crowsnest.conf
#### This is a typical default config.
#### Also used as default in mainsail / MainsailOS
#### See:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md
#### for details to configure to your needs.


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
#####################################################################
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################


[crowsnest]
log_path: %LOGPATH%
log_level: debug                         # Valid Options are quiet/verbose/debug
delete_log: true                         # Deletes log on every restart, if set to true
no_proxy: false


[cam Gantry]                             # C920 Pro
#mode: ustreamer                          # ustreamer - Provides mjpg and snapshots. (All devices)
mode: camera-streamer                   # camera-streamer - Provides webrtc, mjpg and snapshots. (rpi + Raspi OS based only)
enable_rtsp: true                        # If camera-streamer is used, this enables also usage of an rtsp server
rtsp_port: 8554                          # Set different ports for each device!
port: 8080                               # HTTP/MJPG Stream/Snapshot Port
device: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1:1.0-video-index0 # See Log for available ...
resolution: 1280x720                     #1280x720 #960x720 #800x448 #640x480 (widthxheight format)
max_fps: 15                              # If Hardware Supports this it will be forced, otherwise ignored/coerced.
#custom_flags:--camera-force_active=1    # You can run the Stream Services with custom flags.
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=20 # Add v4l2-ctl parameters to setup your camera, see Log what your cam is capable of.
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=20,exposure_auto=1,exposure_absolute=250,white_balance_temperature_auto=0,white_balance_temperature=4200


[cam Top]                                # C920 Pro
