#####################################################################
#      Master ID Configuration
#####################################################################

## CAN ID
## ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
[mcu SB2040-PRO]  # Tool board serial number
canbus_uuid: 4162d47bf5d5
# Firmware Flashing:
# https://mellow.klipper.cn/en/docs/ProductDoc/ToolBoard/fly-sb2040/sb2040-pro-v3/flash/can

# Firmware Flashing:
# 1. cd ~/klipper && rm -rf ~/klipper/.config && rm -rf ~/klipper/out && make menuconfig
# 2. In the menuconfig interface:  
#       - Enable “Enable extra low-level configuration options”.  
#       - Under “Micro-controller Architecture” select **Raspberry Pi RP2040**.   
#       - Set “Bootloader offset” to **16KiB**.  
#       - Under “Communication interface” select **CAN bus**. 
#       - Set “(4) CAN RX gpio number” to **1**. 
#       - Set “(5) CAN TX gpio number” to **0**. 
#       - Set “GPIO pins to set at micro-controller startup” to `!gpio5`  
#       - Press `Q`, then `Y` to save and exit. 
# 3. make -j4
# 4. python3 ~/klipper/lib/canboot/flash_can.py -u 4162d47bf5d5

# If havving communication issues go to 
# cd klipper/klippy 
# sudo nano mcu.py
# Update TRSYNC_TIMEOUT from 0.025 to 0.050

#####################################################################
#      Master Pin Configuration
#####################################################################

[board_pins SB2040-PRO]
mcu: SB2040-PRO
aliases:
aliases_2240:
    EXT_EN=gpio16,EXT_STEP=gpio14,EXT_DIR=gpio13,EXT_UART=gpio15
aliases_spi:      #Aliases does not work for SCLK, MOSI, AND MISO
    CS=gpio12,SCLK=gpio2,MOSI=gpio3,MISO=gpio4
aliases_endstop:
    LIMIT_0=gpio22,LIMIT_1=gpio18,LIMIT_2=gpio20
aliases_cnc_fans:
    FAN_PC=gpio24,FAN_HE=gpio19, FAN_SB2040=gpio21
aliases_thermistors:
    TH0=gpio27, TH1=gpio28
aliases_heaters:
    HE0=gpio23
aliases_rgb:
    RGBLED=gpio26
aliases_adxl:
    ADXL=gpio12
aliases_pt100:
    PT100=gpio27
	
	
#####################################################################
#      Accelerometer
#####################################################################

[lis2dw]
cs_pin: SB2040-PRO:ADXL
spi_software_sclk_pin: SB2040-PRO:gpio2
spi_software_mosi_pin: SB2040-PRO:gpio3
spi_software_miso_pin: SB2040-PRO:gpio4
#spi_bus:spi0_gpio4_gpio3_gpio2
axes_map: z,y,x

[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20
accel_per_hz: 100
hz_per_sec: 1
sweeping_accel: 400
sweeping_period: 0


#####################################################################
#      Extruder
#####################################################################

[extruder]
step_pin:SB2040-PRO:EXT_STEP
dir_pin:SB2040-PRO:EXT_DIR
enable_pin: !SB2040-PRO:EXT_EN
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
##  47.088 for Galileo 2
rotation_distance: 47.088
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
##  Use 7.5:1 for Galileo
##  Use 9:1 for Galileo 2
gear_ratio:9:1
microsteps:16
full_steps_per_rotation: 200   
nozzle_diameter:0.400
filament_diameter:1.75
heater_pin:SB2040-PRO:HE0
sensor_pin:SB2040-PRO:TH0
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"
##   "ATC Semitec 104NT-4-R025H42G" - E3D REVO
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp:0
max_temp:300
max_power:1.0
min_extrude_temp:170
#max_extrude_only_distance: 150.0   # If extrusion flow error occurs, you can comment this, but it is recommended to re-slice
max_extrude_cross_section: 6  # added from motion-control.cfg
step_pulse_duration: 0.000004  #Not in previous Configs

[tmc2240 extruder]
uart_pin:SB2040-PRO:EXT_UART
run_current: 0.60                      # Motor running current value
interpolate: true                      # Whether to enable 256 microstep interpolation (not recommended) - was false
rref: 12300                            # Drive sampling resistor
stealthchop_threshold: 0               # Silence threshold (if silence is not required, please change the value to 0) - was 99999
driver_TPFD: 0                         # Driver Timing Phase Filter Delay
driver_TPOWERDOWN: 20                  # After X seconds of inactivity, the TMC driver will automatically power down


[verify_heater extruder]
max_error: 60
check_gain_time: 30
heating_gain: 5
hysteresis: 3


#####################################################################
#      Eddy Probe Config 
#####################################################################

[temperature_probe fly_eddy_probe]
sensor_type: Generic 3950
sensor_pin:SB2040-PRO:TH1
horizontal_move_z: 3

[probe_eddy_current fly_eddy_probe]
sensor_type: ldc1612
i2c_address: 43
i2c_mcu: SB2040-PRO
i2c_bus: i2c1b
x_offset: 0                   # remember to set x offset
y_offset: 23.00               # remember to set y offset 
z_offset: 3                   # remember to set z offset
i2c_speed: 4000000