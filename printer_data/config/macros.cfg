#   M117 Quad Gantry Level Complete
#   STATUS_READY                              # LED status for ready
#   BEEP_SUCCESS                              # Beep to indicate completion
#   RESTORE_GCODE_STATE NAME=STATE_QGL
#   M400                                      # Wait for all moves to finish


####################################################################################
#   Print State Macros
####################################################################################

##Slicer Start Macro
#M104 S0 ; Stops PS/SS from sending temp waits separately
#M140 S0
#PRINT_START BED=[first_layer_bed_temperature] EXTRUDER={first_layer_temperature[initial_extruder]+extruder_temperature_offset[initial_extruder]} CHAMBER=[chamber_temperature] SIZE={first_layer_print_min[0]}_{first_layer_print_min[1]}_{first_layer_print_max[0]}_{first_layer_print_max[1]} MATERIAL={filament_type}

[gcode_macro PRINT_START]
description: Print Start Macro
variable_e: 3                                  # Default retract amount
variable_p: 7                                  # Default purge amount
variable_x: 310                                # Park X position
variable_y: 330                                # Park Y position
variable_z: 50                                 # Park Z height
variable_soak_minutes: 15                      # Heat soak duration (minutes)
variable_soak_materials: ["ABS", "ASA", "PC"]  # Materials that require heat soak
variable_preheat_bed_temp: 70                  # Bed preheat temperature
variable_preheat_extruder_temp: 180            # Hotend preheat temperature

gcode:
  ##### --- Runtime Parameters (from slicer or user) --- #####
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set material = params.MATERIAL|default("")|string %}

  ##### --- Start Sequence --- #####
  M117 (10%) Print Start: Homing
  STATUS_HOMING
  SFS_DISABLE
  CLEAR_TEMPERATURE_LED LED=sb_leds
  BED_MESH_CLEAR
  BEEP I=1
  HOME_XYZ

  ##### --- Partial Preheat --- #####
  M117 (20%) Preheating Bed to {preheat_bed_temp}°C
  STATUS_HEATING
  G1 X{x} Y{y} Z{z} F6000
  M107
  M190 S{preheat_bed_temp}
  M117 (30%) Preheating Hotend to {preheat_extruder_temp}°C
  M109 S{preheat_extruder_temp}

  ##### --- Leveling --- #####
  M117 (40%) Quad Gantry Level
  STATUS_LEVELING
  BEEP I=4
  QUAD_GANTRY_LEVEL
  M117 (48%) Home Z
  HOME_Z
  G1 X{x} Y{y} Z{z} F6000

  ##### --- Full Bed Heat --- #####
  M117 (50%) Heating Bed to {target_bed}°C
  STATUS_HEATING
  BEEP I=3
  SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber" target={target_chamber}
  M190 S{target_bed}

  ##### --- Conditional Heat Soak --- #####
  {% if material|upper in soak_materials %}
    {% set soak_msg = "(55%) Heat Soaking for " ~ soak_minutes ~ " min" %}
    M117 {soak_msg}
    M106 S255
    {% for i in range(1, soak_minutes+1) %}
      {% set minute_msg = "(55%) Soaking " ~ i ~ "/" ~ soak_minutes ~ " min" %}
      M117 {minute_msg}
      G4 P60000
    {% endfor %}
    M107
  {% else %}
    M117 (59%) Skipping Heat Soak
  {% endif %}

  ##### --- Final Hotend Heat --- #####
  M117 (60%) Heating Hotend to {target_extruder}°C
  M109 S{target_extruder}
  G1 E-{e} F2100
  RESET_EXTRUDER

  ##### --- Clean + Calibrate --- #####
  M117 (70%) Cleaning Nozzle
  STATUS_CLEANING
  CLEAN_NOZZLE
  G1 E-{e} F2100
  Z_OFFSET_APPLY_PROBE

  ##### --- Bed Mesh --- #####
  M117 (80%) Bed Mesh Calibrate
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  ##### --- Purge + Finalize --- #####
  M117 (90%) Purging
  G1 E{p} F2100
  LINE_PURGE
  M400
  SFS_ENABLE
  BEEP_SUCCESS
  STATUS_READY
  M117 (100%) Print Start Complete


[gcode_macro PRINT_END]
description: Print End Macro
variable_x: 310                # Park X position
variable_y: 330                # Park Y position
variable_z: 10                 # Z lift height
variable_e: 3                  # Retract amount

gcode:
  ##### --- Calculate Safe Z Lift --- #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set lift_z = z|abs %}
  {% if act_z < (max_z - lift_z) %}
      {% set z_safe = lift_z %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}

  ##### --- Start End Sequence --- #####
  M117 Finishing Up
  STATUS_BUSY
  BEEP I=1
  M400                              # Wait for buffer

  ##### --- Retract & Reset --- #####
  RESET_EXTRUDER
  G1 E-{e} F2100
  GO_RELATIVE

  ##### --- Safe Move & Park --- #####
  G0 Z{z_safe} X30 Y30 F10000     # Move nozzle away from print
  GO_ABSOLUTE
  G1 X{x} Y{y} F6000              # XY Park

  ##### --- Disable Systems & Cooldown --- #####
  SFS_DISABLE
  TURN_OFF_HEATERS
  SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=25
  M107                                      # Turn off part cooling fan
  BED_MESH_CLEAR

  ##### --- Final Notifications & LED --- #####
  BEEP_VICTORY
  M117 Print Finished
  STATUS_READY
  SET_TEMPERATURE_LED LED=sb_leds INDEX=1 SENSOR=extruder
  SET_TEMPERATURE_LED LED=sb_leds INDEX=2 SENSOR=heater_bed
  SET_TEMPERATURE_LED LED=sb_leds INDEX=3 SENSOR=heater_bed


[gcode_macro CANCEL_PRINT]
description: Cancel the current print
rename_existing: CANCEL_PRINT_BASE
variable_x: 310        # Park X position
variable_y: 330        # Park Y position
variable_z: 10         # Z lift height
variable_e: 1          # Retract amount

gcode:
  ##### --- Calculate Safe Z Lift --- #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set lift_z = z|abs %}
  {% if act_z < (max_z - lift_z) %}
      {% set z_safe = lift_z %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}

  ##### --- Start Cancel Sequence --- #####
  M117 Canceling Print
  STATUS_BUSY
  BEEP I=1

  ##### --- Retract & Lift --- #####
  GO_RELATIVE
  {% if printer.extruder.can_extrude %}
      G1 E-{e} F2100
  {% endif %}
  G1 Z{z_safe}
  GO_ABSOLUTE

  ##### --- Park Toolhead --- #####
  G1 X{x} Y{y} F6000

  ##### --- Disable Systems --- #####
  SFS_DISABLE
  TURN_OFF_HEATERS
  M107
  CLEAR_PAUSE

  ##### --- Cancel Base Print --- #####
  CANCEL_PRINT_BASE

  ##### --- Post-Cancel Cleanup --- #####
  BED_MESH_CLEAR
  M117 Print Cancelled
  BEEP_FAILURE
  STATUS_READY


[gcode_macro PAUSE]
description: Cleaned-up Pause Macro
rename_existing: BASE_PAUSE
variable_x: 175               # Park X position
variable_y: 0                 # Park Y position
variable_z: 20                # Z lift height
variable_e_retract: 1         # Retract amount
gcode:
  ##### --- Safe Z Calculation --- #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set lift_z = z|abs %}
  {% if act_z < (max_z - lift_z) %}
      {% set z_safe = lift_z %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}

  ##### --- Pause Sequence --- #####
  M117 Pausing Print
  STATUS_BUSY
  BEEP_WARNING
  SFS_DISABLE
  BASE_PAUSE

  ##### --- Retract, Lift, Park --- #####
  GO_RELATIVE
  G1 E-{e_retract} F2100
  G1 Z{z_safe} F6000
  GO_ABSOLUTE
  G1 X{x} Y{y} F6000

  ##### --- Feedback --- #####
  BEEP_WARNING
  M117 Print Paused
  STATUS_READY


[gcode_macro RESUME]
description: Cleaned-up Resume Macro
rename_existing: BASE_RESUME
gcode:
  ##### --- User Parameters --- #####
  {% set e_restore = params.E|default(1)|float %}

  ##### --- Optional Reheat --- #####
  {% if printer.pause_resume.is_paused and printer.idle_timeout.state == 'Idle' %}
      M117 Print Resuming - Reheating
      STATUS_HEATING
      BEEP_WARNING
      M109 S{printer["gcode_macro PRINT_IDLE_TIMEOUT"].extruder_temp}
  {% endif %}

  ##### --- Resume Sequence --- #####
  M117 Print Resuming
  STATUS_BUSY
  GO_RELATIVE
  G1 E{e_restore} F2100
  GO_ABSOLUTE
  BASE_RESUME
  SFS_ENABLE

  ##### --- Feedback --- #####
  BEEP_SUCCESS
  M117 Print Resuming
  STATUS_READY


####################################################################################
#   Spoolman Macros
####################################################################################

[gcode_macro SET_ACTIVE_SPOOL]                           ## Set Active Spool
description: Sets Spoolman active spool
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=id
        )}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}


[gcode_macro CLEAR_ACTIVE_SPOOL]                         ## Clear Active Spool
description: Clears active spoolman spool
gcode:
    {action_call_remote_method(
        "spoolman_set_active_spool",
        spool_id=None
    )}

