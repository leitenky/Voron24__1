####################################################################################
#   Nozzle Wipe Macros
####################################################################################

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 312
variable_start_y: 358
variable_start_z: 1.5
variable_wipe_dist: -50
variable_wipe_qty: 2
variable_wipe_spd: 200
variable_raise_distance: 30
variable_hotend_temp: 180
gcode:
  ##### --- LED and Start Feedback --- #####
  STATUS_CLEANING
  M117 Cleaning Nozzle

  ##### --- Conditional Preheat --- #####
  {% set current_temp = printer.extruder.temperature|float %}
  {% if current_temp < hotend_temp %}
      M117 Preheating Hotend to {hotend_temp} C
      BEEP_WARNING
      M109 S{hotend_temp}
  {% endif %}

  ##### --- Conditional QGL --- #####
  {% if not printer.quad_gantry_level.applied %}
      M117 Homing before nozzle cleaning (QGL not applied)
      STATUS_HOMING
      BEEP_WARNING
      QUAD_GANTRY_LEVEL
  {% endif %}

  ##### --- Cleaning Movements --- #####
  go_absolute                                      # Absolute positioning
  G1 X{start_x} Y{start_y} F6000                   # Move nozzle to start position
  G1 Z{start_z} F1500
  {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 60}
    G1 X{start_x} F{wipe_spd * 60}
  {% endfor %}
  G1 Z{raise_distance}                             # Raise nozzle

  ##### --- Completion Feedback --- #####
  M117 Nozzle Cleaning Complete
  STATUS_READY


