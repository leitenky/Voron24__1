####################################################################################
#   Audio Tones
####################################################################################

[gcode_macro BEEP]
Description: Beep Command
gcode:
    ##### set defaults #####
    {% set i = params.I|default(1)|int %}           # Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}     # Duration/wait of each beep in ms. Default 100ms.
    {% set freq = params.FREQ|default(2000)|int %}  # Frequency in Hz. Default 2kHz.
    ##### end of definitions #####
    {% for iteration in range(i|int) %}
        SET_PIN PIN=beeper VALUE=0.8 CYCLE_TIME={ 1.0/freq if freq > 0 else 1 }
        G4 P{dur}
        SET_PIN PIN=beeper VALUE=0
        G4 P{dur}
    {% endfor %}

## Modifiers ##
 # BEEP Beep once with defaults.
 # BEEP I=3: Beep 3 times with defaults.
 # BEEP I=3 DUR=200 FREQ=2000: Beep 3 times, for 200ms each, at 2kHz frequency.


[gcode_macro BEEP_SUCCESS]
description: "Plays a short success tone sequence"
gcode:
  BEEP I=1 DUR=150 FREQ=880
  G4 P50
  BEEP I=1 DUR=200 FREQ=1760


[gcode_macro BEEP_FAILURE]
description: "Plays a failure/error tone sequence"
gcode:
  BEEP I=1 DUR=200 FREQ=440
  G4 P100
  BEEP I=1 DUR=400 FREQ=220


[gcode_macro BEEP_WARNING]
description: "Plays an attention or warning tone"
gcode:
  BEEP I=1 DUR=200 FREQ=880
  G4 P50
  BEEP I=1 DUR=200 FREQ=880
  G4 P50
  BEEP I=1 DUR=200 FREQ=880


[gcode_macro BEEP_VICTORY]
description: "Plays a victory jingle"
gcode:
  BEEP I=1 DUR=150 FREQ=880
  G4 P50
  BEEP I=1 DUR=150 FREQ=988
  G4 P50
  BEEP I=1 DUR=150 FREQ=1174
  G4 P100
  BEEP I=1 DUR=400 FREQ=1568


[gcode_macro BEEP_COUNT]
description: "Plays N counting beeps. Parameters: N=<count>, MODE=up|down|steady"
gcode:
  {% set n = params.N|default(3)|int %}
  {% set mode = params.MODE|default("up")|string|lower %}
  {% set base_freq = params.FREQ|default(600)|int %}
  {% set step = params.STEP|default(100)|int %}
  {% set dur = params.DUR|default(120)|int %}
  {% set pause = params.PAUSE|default(150)|int %}

  {% for i in range(n) %}
    {% if mode == "up" %}
      {% set freq = base_freq + (i * step) %}
    {% elif mode == "down" %}
      {% set freq = base_freq + ((n - i - 1) * step) %}
    {% else %}
      {% set freq = base_freq %}
    {% endif %}

    BEEP I=1 DUR={dur} FREQ={freq}
    G4 P{pause}
  {% endfor %}


