    PAUSE
    M117 Add/Check Filament
    BEEP_WARNING


[gcode_macro M600]                             ## Filament Change Command
description: Filament Change Command
gcode:
    # ##### set defaults #####
    # {% set X = params.X|default(175)|float %}    # Set X Possition
    # {% set Y = params.Y|default(0)|float %}      # Set y Possition
    # {% set Z = params.Z|default(20)|float %}     # Set Z Lift height
    # {% set E = params.E|default(1) %}            # edit to your retract length
    # ##### calculate safe lift position #####
    # {% set max_z = printer.toolhead.axis_maximum.z|float %}
    # {% set act_z = printer.toolhead.position.z|float %}
    # {% set lift_z = Z|abs %}
    # {% if act_z < (max_z - lift_z) %}
    #     {% set Z_safe = lift_z %}
    # {% else %}
    #     {% set Z_safe = max_z - act_z %}
    # {% endif %}
    # ##### end of definitions #####
    SAVE_GCODE_STATE NAME=M600_state             # this saves the current context, to include relative/absolute modes
    PAUSE                                        # this calls a pause even though pause_on_runout in the sensor config is false
    # go_relative                                  # forces relative gcode processing (for extruder retract and Z movement)
    # G1 E{E} F2700                                # retracts 0.8mm to avoid stringing when lifting the toolhead
    # G1 Z{Z_safe}                                 # move Z relative to current Z position - just raise to avoid hitting the model when moving x/y
    # go_absolute                                  # forces absolute mode so that X/Y can be positioned as commanded (or default)
    # G1 X{X} Y{Y} F3000                           # Move X/Y to the commanded positions (or default X25,Y25 ) to make manipulating the filament easier
    go_relative                                  # and force relative mode (not really needed if no further steps taken before restoring gcode state)
                                                 # this is where you might want to eject the filament from the extruder (i.e. -50 or -100mm or)
                                                 # or call filament unload, or do nothing and let user do it via UI...
    RESTORE_GCODE_STATE NAME=M600_state          # this restores the gcode context that existed on M600 entry
    BEEP_WARNING
	M117 Filament Change Request


[gcode_macro LOAD_FILAMENT]
description: Load filament safely with preheat, parking, and feedback (heater-safe + reset-safe)
variable_park_x: 300          # X park position
variable_park_y: 100          # Y park position
variable_park_z: 30           # Z park height
variable_temp: 210            # Default hotend temp (°C)
gcode:
    SAVE_GCODE_STATE NAME=load_state

    # Disable filament sensor and set active spool
    SFS_DISABLE

    # Home and park toolhead if not homed
    {% if not ("x" in printer.toolhead.homed_axes and 
               "y" in printer.toolhead.homed_axes and 
               "z" in printer.toolhead.homed_axes) %}
        M117 Homing and parking toolhead...
        STATUS_BUSY
        HOME_XYZ
    {% endif %}
    go_absolute
    G0 Z{park_z} X{park_x} Y{park_y} F4000

    # Ensure hotend is heated and heater is on
    {% if (not printer.extruder.can_extrude) or (printer.extruder.target <= 0) %}
        M117 Heating nozzle to {temp}°C...
        STATUS_HEATING
        M104 S{temp}             # Start heating immediately
        M109 S{temp}             # Wait for temperature to stabilize
    {% endif %}

    # Begin filament load
    M117 Loading filament...
    STATUS_BUSY
    BEEP I=1
    go_relative
    reset_extruder
    G1 E50 F500
    reset_extruder
    G1 E50 F300
    reset_extruder
    G1 E50 F300
    reset_extruder
    G1 E-3 F2100
    reset_extruder
    go_absolute

    # Restore previous G-code state
    RESTORE_GCODE_STATE NAME=load_state

    # Finish feedback
    M117 Filament load complete!
    BEEP_SUCCESS
    STATUS_READY
    

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament safely with preheat and feedback (reset-safe + consistent style)
variable_temp: 210            # Default hotend temp (°C)
gcode:
    SAVE_GCODE_STATE NAME=unload_state

    # Disable filament sensor
    SFS_DISABLE

    # Preheat if below minimum extrusion temp or heater is off
    {% if (not printer.extruder.can_extrude) or (printer.extruder.target <= 0) %}
        M117 Heating nozzle to {temp}°C...
        STATUS_HEATING
        M104 S{temp}             # Start heating immediately
        M109 S{temp}             # Wait for temperature
    {% endif %}

    # Begin filament unload
    BEEP I=1
    M117 Filament Unload Started
    STATUS_BUSY
    go_relative
    reset_extruder
    G1 E5 F300                   # Purge
    reset_extruder
    G1 E-50 F500                 # Slow unload
    reset_extruder
    G1 E-50 F800                 # Fast unload
    reset_extruder
    go_absolute

    # Turn off extruder
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0

    # Restore previous state
    RESTORE_GCODE_STATE NAME=unload_state

    # Wrap up
    CLEAR_ACTIVE_SPOOL
    SET_TEMPERATURE_LED LED=sb_leds INDEX=1 SENSOR=extruder
    M117 Filament Unload Complete
    BEEP_SUCCESS
    STATUS_READY



