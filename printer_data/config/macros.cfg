[gcode_macro PRINT_IDLE_TIMEOUT]
description: Idle Timeout Macro
variable_extruder_temp: 0
gcode:
  {% if printer.pause_resume.is_paused %}
      M117 Idle but paused, maintaining bed temp.
      SET_GCODE_VARIABLE MACRO=PRINT_IDLE_TIMEOUT VARIABLE=extruder_temp VALUE={printer[printer.toolhead.extruder].target}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
      M117 Idle Timeout
      M84                                                          # Turn steppers off
      TURN_OFF_HEATERS                                             # Turn bed / hotend off
      M107                                                         # Turn print cooling fan off
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0  # Turn exhaust fan off
	  STATUS_OFF                                                   # LED Status
  {% endif %}

  
[gcode_macro Off]                                                 ## Turn off Heaters Fans and LEDs
description: Turn Off Heaters and LEDs
gcode:
    M84                                                            # Turn steppers off
    TURN_OFF_HEATERS                                               # Turn bed / hotend off
