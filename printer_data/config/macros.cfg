    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=0    # Turn exhaust fan off
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=34                    # Wait to shutdown until Extruder is Cold
    Chamber_Lights_Off                                             # Turn case light off
    set_logo_leds_off                                              # Turn off Logo
    set_nozzle_leds_off                                            # Turn off nozzle


